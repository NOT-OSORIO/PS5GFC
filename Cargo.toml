[workspace]
resolver = "2"
members = ["crates/ps5gfc-core", "crates/ps5gfc-cli", "src-tauri"]

[workspace.package]
version = "0.1.5"
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.80"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
crc32fast = "1"
crossbeam-channel = "0.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = 1

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 2
